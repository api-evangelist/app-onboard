prices_note: >-
  NO PRICE IS PUBLISHED ANONYMOUSLY. https://www.quvy.com/pricing/ returns HTTP 200 but
  the server-rendered body reads "No plans available" and then bails to client-side
  rendering (BAILOUT_TO_CLIENT_SIDE_RENDERING). Amounts, quotas and overage are fetched
  at runtime from Quvy's authenticated billing backend, so every `price` below is null.
  Recording a number here would be a guess. The tier NAMES are genuinely published — they
  ship inside the pricing page's own payload and client bundle — and are recorded verbatim.

