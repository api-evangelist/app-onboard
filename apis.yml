name: App Onboard
description: >-
  AppOnBoard, Inc. is a Los Angeles-based technology company founded in 2016 that
  builds AI-driven creative and advertising tools for app and game marketers. Its
  best-known product is Buildbox, a no-code platform for making games and apps
  without programming, and its current flagship is Quvy, an AI ad-creation and
  testing platform that generates static, video, and concept ad variations and
  predicts their performance against synthetic audiences before any real ad spend.
  Quvy targets marketers, indie and studio game developers, SaaS companies, and
  brands that want to replace slow, expensive A/B testing and agencies with fast
  simulation-based creative optimization. AppOnBoard is backed by 500 Global; its
  original apponboard.com domain now redirects to the Quvy product at quvy.com.
  This profile carries the company identity and website properties; AppOnBoard
  publishes no public API, developer portal, SDKs, or OpenAPI at this time.
